	//to save the report to the database
	//User may click the XBRL download without clicking save button.
	//So, Whenever XBRL Download button clicked, it will first save the form data in Detail table
	//And the call the save function - which will move the data into the report table - And generates xbrl instance.
	//And then download the file.
	//to check for report or arch
	//if report --->>> precheck and then save report else throws error
	function savereport() {

		if (dtltype == 'report') {
			var Callurl = /*[[@{'/Reports/'+${reportid}+'/PrecheckFromrpt'(asondate=${asondate},fromdate=${fromdate},todate=${todate})}]]*/
			$
					.ajax({
						type : 'get',
						url : Callurl,
						success : function(data) {

							if (data == 'success') {

								$("#loader").show();

								var Callurl = /*[[@{'/Reports/'+${reportid}+'/save'(asondate=${asondate},fromdate=${fromdate},todate=${todate},currency=${currency})}]]*/
								$.ajax({
									type : 'get',
									url : Callurl,
									success : function(data) {

										if (data == 'success') {

											var Callurl = /*[[@{'/Reports/'+${reportid}+'/DownloadFormRptScr'(asondate=${asondate},fromdate=${fromdate},todate=${todate},currency=${currency})}]]*/
											Callurl = Callurl
													+ "&filetype=xbrl";
											location.href = Callurl;
											$("#loader").hide();
										} else {
											$("#loader").hide();
											$("#alertmsg").text(data);
											$('#alert').modal("toggle");
										}
									}
								})

							} else {
								$("#alertmsg")
										.text(
												"Please verify the Pending Records Before Generating XBRL Instance");
								$("#alert").modal("toggle");
							}

						}
					});

		} else {

			var Callurl = /*[[@{'/Reports/'+${reportid}+'/DownloadFormRptScr'(asondate=${asondate},fromdate=${fromdate},todate=${todate},currency=${currency})}]]*/
			Callurl = Callurl + "&filetype=xbrl";
			location.href = Callurl;
			$("#loader").hide();
		}

	}

				dd = '0' + dd;
			}
			if (mm < 10) {
				mm = '0' + mm;
			}
			var today = dd + '/' + mm + '/' + yyyy;
			document.getElementById('entry_time1').value = today;
			document.getElementById('verify_time1').value = today;
			document.getElementById('modify_time1').value = today;
		});
	</script>
