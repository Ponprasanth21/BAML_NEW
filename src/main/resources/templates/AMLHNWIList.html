	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);
		var max = parseInt(maxpage);

		var Callurl = 'AMLHNWIList?formmode=list';

		switch (mode) {
		case "nextpage":
			n = n + 1;
			if (n > max) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "prevpage":
			n = n - 1;
			if (n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "givenpage":
			n = parseInt($("#pageno").val()) - 1;
			if (n > max || n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
		}

		location.href = Callurl;
	}

	function verifyform(a) {
		if ($("#HnwiParameter").valid()) {
			var entry=$("#aml_entry_user").val();
			var modify=$("#aml_modify_user").val();
			var verify=$("#aml_verify_user").val();
			
			if(modify!= null){
				if(modify != verify && entry != verify){
					var formmode = a.getAttribute("data-formmode");
					var url = "./createHnwiList?formmode=" + formmode;

					$("#HnwiParameter").attr('action', url);

					var options = {
						success : showResponse
					// post-submit callback 
					};
					

					$("#HnwiParameter").ajaxSubmit(options);

					function showResponse(responseText, statusText, xhr, $form) {

						$("#alertmsg").text(responseText);

						$('#alert').modal("toggle");

					};
				}else{
					$("#verifyboxmsg").text("Same User Cannot Verify!");
					$('#verifybox').modal("toggle");
				
					
				}
			}else if( modify == null){
				if(entry != verify){
					var formmode = a.getAttribute("data-formmode");
					var url = "./createHnwiList?formmode=" + formmode;

					$("#HnwiParameter").attr('action', url);

					};
				}else{
					$("#verifyboxmsg").text("Same User Cannot Verify!");
					$('#verifybox').modal("toggle");
				
					
				}
				
			}
			
		}
	};

								<button type="button" class="btn btn-primary"
									data-dismiss="modal" onclick="list();">Close</button>
							</div>
						</div>
					</div>
				</div>
				<div class="modal fade" id="verifybox">
					<div
						class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
						<div class="modal-content">
							<div class="modal-body" style="text-align: center">
								<p id="verifyboxmsg"></p>
								<button type="button" class="btn btn-primary"
									data-dismiss="modal">OK</button>
							</div>
						</div>
					</div>
				</div>

				<!--------------------------------------------File Upload Modal Starts----------------------------------------------------------->
			<div class="modal fade" id="fileupload">
					<div
						class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
						<div class="modal-content">
							<div class="modal-body" style="text-align: center">
							<h1> Upload only xlsx, xls or csv files</h1><br/><br/>
							
							
							 <form action="#" th:object="${fileUploadForm}" method="POST"
								autocomplete="off" id="fileUploadForm" enctype="multipart/form-data">
								
									<input id="file" type="file" name="file" accept=".xls,.xlsx,.csv" style="background-color: white;"/><br/><br/>
    									<input type="hidden" id="screenid" name="screenid" value="HNWI_List" >
    									<button type="button" style="margin-top: -12px;"
												class="btn btn-xs btn-primary" onclick="fire_ajax_submit();"
												form="uploadform" id="btn_Upload_Submit"
												>Submit</button>
													<button type="button" style="margin-top: -12px;"
												class="btn btn-xs btn-primary" onclick="closeuplaod();"
												form="uploadform" id="btn_Upload_Submit"
												>Cancel</button>
											</form>	
												
												
								
							
							</div>
						</div>
					</div>
				</div>
	
	
	
	<!--------------------------------------------File Upload Modal Ends----------------------------------------------------------->

				


			</div>
		</div>
	</div>
	<!--------------------------------------------------------------- Modal for alert messages-------------------------------->
	<script th:inline="javascript">
	
	function closeuplaod() {
		$('#fileupload').hide();
		location.href = './AMLHNWIList?formmode=list';
	}
		
		function fire_ajax_submit() {
			
		    // Get form
		    var form = $('#fileUploadForm')[0];

		    var data = new FormData(form);

		   
		   

		    $.ajax({
		        type: "POST",
		        enctype: 'multipart/form-data',
		        url: "ws/fileUpload",
		        data: data,
		        processData: false, //prevent jQuery from automatically transforming the data into a query string
		        contentType: false,
		        cache: false,
		        timeout: 600000,
		        success: function (data) {
		        	
		        	$('#fileupload').hide();
		        	
		        	$("#alertmsg").text(data);
		        	
					$("#alert").modal("toggle");

		           
		            

		        },
		        error: function (e) {
		        	
		        	$('#fileupload').hide();
		        	
		        	$("#alertmsg").text(e.responseText);
					$("#alert").modal("toggle");
					
					location.href = './AMLHNWIList?formmode=list';
		     

		        }
		    });
		}
				
	</script>
	
</body>
</html>
