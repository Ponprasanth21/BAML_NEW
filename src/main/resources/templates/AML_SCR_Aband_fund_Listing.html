	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);
		var max = parseInt(maxpage);

		/* 		alert(n+"  "+max);
		 */var Callurl = 'AML_SCR_ABAND_FUNDListing?formmode=list';

		switch (mode) {
		case "nextpage":
			n = n + 1;
			if (n > max) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "prevpage":
			n = n - 1;
			if (n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "givenpage":
			n = parseInt($("#pageno").val()) - 1;
			if (n > max || n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
		}

		/* 		alert(Callurl);
		 */location.href = Callurl;
	}

	function searchcustid() {
		$("#CustSearch").modal('hide');
		var custid2 = $("#custid").val();

		$('#CustomerInq').empty();
		$.ajax({
			type : 'get',
			url : "/AML/getcustomerId/" + custid2,

			success : function(response) {
				var trHTML = "", dateOfBirth, PhoneNumber, EMAIL, NatID;

				$.each(response, function(key, value) {

					if (value.date_of_birth === null) {
						
						dateOfBirth = '';
					} else {
						dateOfBirth = value.date_of_birth;
					}
					if (value.cust_perm_phone_num === null) {
						
						PhoneNumber = '';
					} else {
						PhoneNumber = value.cust_perm_phone_num;
					}
					if (value.email_id === null) {
	
						EMAIL = '';
					} else {
						EMAIL = value.email_id;
					}
					if (value.nat_id_card_num === null) {
						NatID = '';
					} else {
						NatID = value.nat_id_card_num;
					}

					trHTML += '<tr><td>' + value.cust_id + '</td><td>'
							+ value.cust_name + '</td><td>' + dateOfBirth
							+ '</td><td>' + PhoneNumber + '</td><td>' + EMAIL
							+ '</td><td>' + NatID + '</td><td>'
							+ value.cust_nre_flg + '</td></tr>';
				});
				if(trHTML == []){
					var data = 'No Data Found'
					$('#CustomerInq').append('<tr id="CustomerInq" ><td colspan="7" style="text-align:center;color:red">No Data Found</td></tr>');
					$('#paginationCust').hide();
				}else{
				$('#CustomerInq').append(trHTML);
				$('#paginationCust').hide();
			}
			}

		});
	}

	function convertDate(dateString){
		var p = dateString.split(/\D/g)
		return [p[2],p[1],p[0] ].join("-")
		}

<body>
	<div th:replace="AStartheader :: header"></div>

		aria-hidden="true" onclick="docEmb('Report')" id="ques"></i>
	<div class="content-page">
		<div class="content">
			<div class="container-fluid">
				<div th:if="${formmode}=='list'" class="content">
					<div class="row">
						<div class="col-sm-12">
							<div class="card-header " id="modheadtitle">
								<b>Abandoned Fund Listing</b>
							</div>
							<label></label>
					
							<table class="table table-bordered  table-hover table-sm"
								style="width: 100%" id="usertable">
								<thead class="thead-light">

									<tr>
									<!--  with searchor   -->
									
										<!-- <th style="width:9%;">Customer Id<i class="fas fa-search searchico" style="float: right;"aria-hidden="true" onclick="custidsearch()"></i></th>
										<th style="width:37%;">Customer Name<i class="fas fa-search searchico" style="float: right;"aria-hidden="true" onclick="custnamesearch()"></i></th>
										<th style="width:9%;">Date Of Birth<i class="fas fa-search searchico" style="float: right;"aria-hidden="true" onclick="custdobsearch()"></i></th>
										<th style="width:11%;">Phone Number<i class="fas fa-search searchico" style="float: right;"aria-hidden="true" onclick="custnumbersearch()"></i></th>
										<th style="width:20%;">Email<i class="fas fa-search searchico" style="float: right;"aria-hidden="true" onclick="custemailsearch()"></i></th>

										<th style="width:4%;">NRE</th> -->
										
										<th>Customer ID</th>

										<th>Maturity Date </th>
										<th>Amount (Rs)</th>
										<th>Interest Paid</th>
										
									</tr>
								</thead>
								<tbody id="CustomerInq" >
								<tr th:if="${customerBlackList.totalPages} == '0'">
										<td colspan="14" style="text-align: left; color: red">No
											record available for this peroid</td>
									</tr>
									<tr th:each="userProfile : ${customerBlackList}"
										th:attr="data-cust_id=${userProfile.cust_id}"
										th:id="${userProfile.cust_id}" class="userlist">
										
										<td th:text="${userProfile.cust_id}"></td>
										<td th:text="${userProfile.acct_name}"></td>
										<td th:text="${userProfile.nature_of_tran}"></td>
										<td th:text="${userProfile.prod_type}"></td>

										<td th:text="${userProfile.interest_paid}"></td>
										 
										
									</tr>
								</tbody>
							</table>

							<div class="float-right" id="paginationCust"
								th:if="${customerBlackList.totalPages} gt 1">

								<input type="text" id="pageno" style="width: 30px"
									th:value="${customerBlackList.number+1}"
