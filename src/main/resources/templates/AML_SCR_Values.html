<script type="text/javascript">
var deleteval;

function getCorp_Userlist(mode, num, maxpage) {

	var n = parseInt(num);
	var max = parseInt(maxpage);

	var Callurl = 'AML_SCR_Values?formmode=Customers';

	switch (mode) {
	case "nextpage":
		n = n + 1;
		if (n > max) {
			break;
		}
		Callurl = Callurl + "&page=" + n;
		break;
	case "prevpage":
		n = n - 1;
		if (n < 0) {
			break;
		}
		Callurl = Callurl + "&page=" + n;
		break;
	case "givenpage":
		n = parseInt($("#pageno").val()) - 1;
		if (n > max || n < 0) {
			break;
		}
		Callurl = Callurl + "&page=" + n;
	}

	location.href = Callurl;
}
