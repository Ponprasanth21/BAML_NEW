<link rel="stylesheet"
	href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<script th:inline="javascript">
	/*<![CDATA[*/
		
		var reportlist = /*[[${reportlist}]]*/null;
		var fromdate = /*[[${fromDate}]]*/null;
		var todate = /*[[${toDate}]]*/null;
	
		function showReportName() {
			
			var fun = $('#function :selected').val();
			var selectedIndex = $("#reportlist option:selected").index();
			
			var report = reportlist[selectedIndex - 1];
			var reportname = report.reportid;
			
			$("#repname").val(report.reportname);
			$("#repname").text(report.reportname);

		};
		
		
		
		$(function(){
			
			$.validator.addMethod("valueNotEquals", function(value, element, arg){
				  return arg !== value;
				 }, "Please Select");
			
			 $("#reportform").validate({
				 rules: {
					 reportid: { valueNotEquals: "Select" }
				 },
				  messages: {
					  reportid : { valueNotEquals: "Please Select a Report Id" }
				  },
				  submitHandler: function(form){
					  var selectedIndex = $("#reportlist option:selected").index();
					  var report = reportlist[selectedIndex - 1];
					  
					  var Callurl;
					 
						
						var reportid=report.reportid;
						
						$("#reportform").attr('action', 'Reports/' + reportid +'?dtltype=report' +'&fromdate=' + fromdate + '&todate=' + todate);
					  
						Callurl =  './Reports/' + report.reportid + '/Precheck?fromdate=' + fromdate + '&todate=' + todate;
						
						$.ajax({
							type : 'get',
							url : Callurl,
							success : function(data) {
								if (data == 'success') {
									form.submit();
								} else {
									$("#alertmsg").text(data);
									$("#alert").modal("toggle");
								}

							}
						});
					  
					  
					  
					  
				  }
				 
			 })
			 
			
		});
		
		function getReport(a){
		
			var fromdate =a.getAttribute("data-fromdate");
			var todate =a.getAttribute("data-todate");
		
			var reportid = a.getAttribute("data-rptcode");
			  var selectedIndex = $("#reportlist option:selected").index();
			  var report = reportlist[selectedIndex - 1];
			  
			  var Callurl;
			 
			  var form = $('#reportform')[0];

			    

				
				
				$("#reportform").attr('action', 'Reports/' + reportid +'?dtltype=report' +'&fromdate=' + fromdate + '&todate=' + todate);
			  
				Callurl =  './Reports/' + reportid + '/Precheck?fromdate=' + fromdate + '&todate=' + todate;
				
				$.ajax({
					type : 'get',
					url : Callurl,
					success : function(data) {
						if (data == 'success') {
							var type='RBS'
							$("#reportform").attr('action', 'Reports/' + reportid +'?dtltype=report' +'&fromdate=' + fromdate + '&todate=' + todate + '&type=' +type);

							form.submit();
						} else {
							$("#alertmsg").text(data);
							$("#alert").modal("toggle");
						}

					}
				});
			  
			  
			  
			  
		  }
		  function home() {
		  		location.href = 'Dashboard';
		  	}
		  	function back() {
		  		var formmode = $("#formmode1").val() || new URLSearchParams(window.location.search).get('formmode');
		  		if (formmode && formmode !== "list") {
		  			location.href = 'ReferenceCodeMaster?formmode=list';
		  		} else {
		  			location.href = 'Dashboard';
		  		}
		  	}
	

	/*]]>*/
</script>

</head>

<body>
	<div th:insert="AStartheader :: header"></div>

		<div class="content-page" style="margin-top: 5px;">
		<div class="content">
			<div class="container-fluid">
			<form class="form-horizontal" method="post" name="CriteriaForm"
					id="reportform">
				<div class="content">
					<div class="row">
						<div class="col-sm-12">
							<div class="card-header " id="modheadtitle">
								<b>RBS REPORTS</b>
							</div>					
							<div class="card-body" s>
								<div style="height:200px; overflow-y: scroll; overflow-x: auto; display: block;">
						<table class="table table-bordered  table-hover table-sm"
								style="width: 100%" id="usertable">
								<thead class="thead-light">

									<tr>
										<!-- <th></th> -->
										<th style="width: 7%;">Report Code</th>
										<th style="width: 47%;">Report Name</th>
										<th style="width: 9%;">Start Date</th>
										<th style="width: 9%;">End Date</th>
										<th style="width: 10%;">Report Type</th>
										<th style="width: 8%;">Detail Flag</th>
										<th style="width: 10%;">Status</th>


									</tr>
								</thead>
								<tbody id="CustomerInq">
									<tr th:if="${COUNT} == '0'">
										<td colspan="9" style="text-align: center; color: red">No
											Data Found</td>
									</tr>
									<tr th:each="userProfile : ${reportlist}"
										th:attr="data-cust_id=${userProfile.srl_no}"
										th:id="${userProfile.srl_no}" class="userlist">



										<td class="underline" onclick="getReport(this);"
											th:attr="data-rptcode=${userProfile.rpt_code},data-fromdate=${#dates.format(userProfile.cur_qtr_start_date, 'dd/MM/yyyy')},data-todate=${#dates.format(userProfile.cur_qtr_end_date, 'dd/MM/yyyy')}"
											th:text="${userProfile.rpt_code}"></td>

										<td th:text="${userProfile.rpt_description}"></td>
										<td th:text="${#dates.format(userProfile.cur_qtr_start_date, 'dd/MM/yyyy')}"></td>
										<td th:text="${#dates.format(userProfile.cur_qtr_end_date, 'dd/MM/yyyy')}"></td>
										<td th:text="${userProfile.rpt_type}"></td>
										<td th:text="${userProfile.det_flg}"></td>
										<td th:text="${userProfile.rpt_status}"></td>

									</tr>
								</tbody>
							</table>
							</div>

						

						</div>

						<div class="col-sm-12 ">
						<div class="text-center"
						     style="background-color: #386276;
						            padding: 5px;
						            width: 100%;
						            box-sizing: border-box;
						            margin: 0;">
						    <div class="btn-group nav-buttons">
						        <button type="button"
						                class="btn btn-xs btn-primary"
						                id="btnHome"
						                onclick="home()"
						                style="margin-right: 10px;">Home</button>

						        <button type="button"
						                class="btn btn-xs btn-primary"
						                id="btnBack"
						                onclick="back()">Back</button>
						    </div>
						</div>
						</div>
					</div>
			</div>
		</div></form>
	</div>
</div>
</div>

			class="modal-dialog modal-dialog-centered modal-dialog-scrollable">

				<div class="modal-body" style="text-align: center">

					<button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>
