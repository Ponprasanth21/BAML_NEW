});

	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);
		var max = parseInt(maxpage);

		var Callurl = 'monitoringparameter?formmode=list';

		switch (mode) {
		case "nextpage":
			n = n + 1;
			if (n > max) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "prevpage":
			n = n - 1;
			if (n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "givenpage":
			n = parseInt($("#pageno").val()) - 1;
			if (n > max || n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
		}

		location.href = Callurl;
	}

<script>





function submitform(a) {
	
	
	if ($("#MonitorParameter").valid()) {
		
		

		
			
			var formmode = a.getAttribute("data-formmode");
			
			var url = "./createMonitoringParameter?formmode=" + formmode;
			

			$("#MonitorParameter").attr('action', url);

			var options = {
				success : showResponse
			// post-submit callback 
			};

			$("#MonitorParameter").ajaxSubmit(options);
			function showResponse(responseText, statusText, xhr, $form) {
				
				$("#alertmsg").text(responseText);

				$('#alert').modal("toggle");

			}
			;

		
		
	}
	/* } */
};
function verifyform(a) {
	if ($("#MonitorParameter").valid()) {
		var entry = $("#entry_user").val();
		var modify = $("#modify_user").val();
		var verify = $("#verify_user").val();
		

		if (modify != null) {
			if (modify != verify) {
				var formmode = a.getAttribute("data-formmode");
				var url = "./createMonitoringParameter?formmode=" + formmode;

				$("#MonitorParameter").attr('action', url);

				var options = {
					success : showResponse
				// post-submit callback 
				};

				$("#MonitorParameter").ajaxSubmit(options);

				function showResponse(responseText, statusText, xhr, $form) {

					$("#alertmsg").text(responseText.status);

					$('#alert').modal("toggle");

				}
				;
			} else {
				$("#verifyboxmsg").text("Same User Cannot Verify!");
				$('#verifybox').modal("toggle");

			}
		} else if (modify == null) {
			if (entry != verify) {
				var formmode = a.getAttribute("data-formmode");
				var url = "./createMonitoringParameter?formmode=" + formmode
						+ '&nid=' + nid + '&paydate=' + paydate
						+ '&paymode=' + paymode + '&custId=' + custId;

				$("#MonitorParameter").attr('action', url);

				var options = {
					success : showResponse
				// post-submit callback 
				};

				$("#MonitorParameter").ajaxSubmit(options);

				function showResponse(responseText, statusText, xhr, $form) {

					$("#alertmsg").text(responseText.status);

					$('#alert').modal("toggle");

				}
				;
			} else {
				$("#verifyboxmsg").text("Same User Cannot Verify!");
				$('#verifybox').modal("toggle");

			}

		}

	}
};

function Ruledesc(a){
	
	//alert("321");
	$("#finusers").modal("hide");
	
	var rulecode = a.getAttribute("data-rulecode")
	
	
	//alert(rulecode);
	$
	.ajax({
		type : 'get',
		
		url : "./AML/getRuleCode/" + rulecode,

		success : function(response) {

			if(response=='Failure'){
				$("#rule_code").val("");
				$("#rule_code_desc").val("");
				$("#verifyboxmsg").text("Selected Rule Already Existing !!!");
				$('#verifybox').modal("toggle");
			}else{
				$("#rule_code").val(rulecode);
				$("#rule_code_desc").val(response);
			}

		}

	});
}

</script>
