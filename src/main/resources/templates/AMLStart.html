 <html >
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML</title>
<script src="/webjars/jquery/3.4.1/jquery.js"
	th:src="@{/webjars/jquery/3.4.1/jquery.js}"></script>
<link rel="stylesheet" type="text/css"
	href="/webjars/bootstrap/4.3.1/css/bootstrap.css"
	th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.css}">
<script src="/webjars/bootstrap/4.3.1/js/bootstrap.js"
	th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.js}"></script>


<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
<script src="js/bootstrap411.js"></script>
<script>
$(function() {
var windHeight = $( window ).height();
var topmargin = (windHeight/2)-(353/2);
$(".login").css("margin-top",topmargin*0.8+"px");

});

$(window).resize(function() {
	var windHeight = $( window ).height();
	var topmargin = (windHeight/2)-(353/2);
	$(".login").css("margin-top",topmargin*0.8+"px");
});

</script>  
<style>
body {
	/* background-image: url("images/BackGround.jpg"); */
	float: left;
	background: #00000a url(images/BackGround.jpg) right;
	background-size: cover;
	background-repeat: no-repeat;
	background-size: 900px 800px;
	padding: 10px;
}
</style>
<style>
/*
 * Specific styles of signin component
 */
/*
 * General styles
 */
.card-container.card {
	max-width: 350px;
	padding: 40px 40px;
}

.btn {
	font-weight: 700;
	height: 36px;
	-moz-user-select: none;
	-webkit-user-select: none;
	user-select: none;
	cursor: default;
}

/*
 * Card component
 */
.card {
	background-color: rgba(255, 255, 255, 0.7);
	/* just in case there no content*/
	padding: 20px 25px 30px;
	margin: 0 auto 25px;
	margin-top: 50px;
	/* shadows and rounded borders */
	-moz-border-radius: 2px;
	-webkit-border-radius: 2px;
	border-radius: 2px;
	-moz-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
	-webkit-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
	box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
}

.profile-img-card {
	width: 96px;
	height: 96px;
	margin: 0 auto 10px;
	display: block;
	-moz-border-radius: 50%;
	-webkit-border-radius: 50%;
	border-radius: 50%;
}

/*
 * Form styles
 */
.profile-name-card {
	font-size: 16px;
	font-weight: bold;
	text-align: center;
	margin: 10px 0 0;
	min-height: 1em;
}

.reauth-email {
	display: block;
	color: #404040;
	line-height: 2;
	margin-bottom: 10px;
	font-size: 14px;
	text-align: center;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	-webkit-box-sizing: border-box;
	box-sizing: border-box;
}

.form-signin #inputEmail, .form-signin #inputPassword {
	direction: ltr;
	height: 44px;
	font-size: 16px;
}

.form-signin input[type=email], .form-signin input[type=password],
	.form-signin input[type=text], .form-signin button {
	width: 100%;
	display: block;
	margin-bottom: 10px;
	z-index: 1;
	position: relative;
	-moz-box-sizing: border-box;
	-webkit-box-sizing: border-box;
	box-sizing: border-box;
}

.form-signin .form-control:focus {
	border-color: rgb(104, 145, 162);
	outline: 0;
	-webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075), 0 0 8px
		rgb(104, 145, 162);
	box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075), 0 0 8px
		rgb(104, 145, 162);
}

.btn.btn-signin {
	/*background-color: #4d90fe; */
	background-color: rgb(0, 59, 101);
	/* background-color: linear-gradient(rgb(104, 145, 162), rgb(12, 97, 33));*/
	padding: 0px;
	font-weight: 700;
	font-size: 14px;
	height: 36px;
	-moz-border-radius: 3px;
	-webkit-border-radius: 3px;
	border-radius: 3px;
	border: none;
	-o-transition: all 0.218s;
	-moz-transition: all 0.218s;
	-webkit-transition: all 0.218s;
	transition: all 0.218s;
}

.btn.btn-signin:hover, .btn.btn-signin:active, .btn.btn-signin:focus {
	background-color: rgb(80, 95, 105);
}

.forgot-password {
	color: rgb(104, 145, 162);
}

.forgot-password:hover, .forgot-password:active, .forgot-password:focus
	{
	color: rgb(12, 97, 33);
}

;
/* LOGIN CARD */

.card-container.card {
    max-width: 370px;
    padding: 35px 38px;
}

.card {
    background: rgba(255, 255, 255, 0.94);
    padding: 30px 35px 35px;
    margin: 0 auto 25px;
    margin-top: 50px;

    border-radius: 12px;

    border: 1px solid rgba(255, 255, 255, 0.7);

    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);

    backdrop-filter: blur(8px);
}

/* LOGO */

.profile-img-card {
    width: 90px;
    height: 90px;
    margin: 0 auto 12px;
    display: block;
    border-radius: 50%;
    object-fit: contain;
    padding: 5px;
}

/* LOGIN TITLE */

.profile-name-card {
    font-size: 23px;
    font-weight: 700;
    text-align: center;
    margin: 12px 0 28px;
    color: #153650;
    letter-spacing: 0.5px;
}

/* INPUT FIELDS */

.form-signin input[type=email],
.form-signin input[type=password],
.form-signin input[type=text] {
    width: 100%;
    height: 46px;
    display: block;
    margin-bottom: 18px;
    padding: 10px 14px;

    font-size: 14px;
    color: #263b4d;

    background: #f8fafc;

    border: 1px solid #d5dfe8;
    border-radius: 6px;

    box-sizing: border-box;
    transition: all 0.2s ease;
}

.form-signin input::placeholder {
    color: #929eaa;
    font-size: 13px;
}

.form-signin input:focus {
    background: #ffffff;
    border-color: #17618a;
    outline: none;

    box-shadow: 0 0 0 3px rgba(23, 97, 138, 0.12);
}

/* INPUT LABELS */

.form-signin input[name="userid"] {
    margin-top: 5px;
}

.form-signin input[name="password"] {
    margin-top: 5px;
}

/* SIGN IN BUTTON */

.btn.btn-signin {
    width: 100%;
    height: 44px;

    background: #123c5d;
    color: #ffffff;

    padding: 0;
    font-size: 14px;
    font-weight: 600;

    letter-spacing: 0.5px;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    transition: all 0.25s ease;
}

.btn.btn-signin:hover,
.btn.btn-signin:focus {
    background: #17658c;
    color: #ffffff;

    box-shadow: 0 5px 14px rgba(18, 60, 93, 0.22);
}

/* LOGIN MESSAGE */

.card-container span {
    font-size: 12px;
}

/* RESPONSIVE */

@media (max-width: 480px) {

    .card-container.card {
        max-width: 100%;
        padding: 28px 24px;
    }

    .card {
        margin-left: auto !important;
        margin-right: auto !important;
    }

    .profile-name-card {
        font-size: 21px;
    }
}

</style>
</head>
<body>
	<div class="container login">
		<div class="card card-container" style="margin-left: 164px;">
			<img id="profile-img" class="profile-img-card"
				th:src=@{/images/born_fire_logo.png} />
			<p id="profile-name" class="profile-name-card">BAML Login</p>
			<form th:action="@{/login}" method="post" name="Login_Form"
				class="form-signin">
				<input type="text" onkeyup="this.value = this.value.toUpperCase();"
					class="form-control" name="userid" placeholder="User Id"
					id="userid" required autofocus> <input type="password"
					class="form-control" name="password" placeholder="Password"
					id="password" required>
				<div style="text-align: center; padding-bottom: 10px;">
					<span style="color: #cd103c;" th:if="${param.error}"
						th:text="${param.error}">test</span> <span style="color: #34af32;"
						th:if="${param.logout}">You have been logged out.</span>
				</div>
				<button class="btn btn-lg btn-primary btn-block btn-signin"
					type="submit">Sign in</button>
			</form>
			<!-- /form -->
		</div>
		<!-- /card-container -->
	</div>
	<!-- /container -->
</body>
</html>
