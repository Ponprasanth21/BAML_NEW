<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
<script th:inline="javascript">
	$(function() {

		$("#usertable").DataTable({
			"paging" : false,
		});
	});

	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);
		var max = parseInt(maxpage);

		
		var Callurl = 'AMLAccountMaster?formmode=list';

		switch (mode) {
		case "nextpage":
			n = n + 1;
			if (n > max) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "prevpage":
			n = n - 1;
			if (n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "givenpage":
			n = parseInt($("#pageno").val()) - 1;
			if (n > max || n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
		}

		
		location.href = Callurl;
	}

	function home() {
		location.href = 'Dashboard'
	}

	function back() {
		window.history.back();
	}
	
	
	function fnClick(a) {
		var acid = a.getAttribute("data-acid")
		location.href = 'AMLAccountMaster1?acid=' + acid;
	}

	/*]]>*/
</script>
</head>
<title>AML</title>

<body>
	<div th:replace="AStartheader :: header"></div>
	<i class="fa fa-question-circle" style="float: right; margin-top: 10%;"
		aria-hidden="true" onclick="docEmb('Report')" id="ques"></i>
	<div class="content-page">
		<div class="content">

			<!-- Start Content-->
			<div class="container-fluid">

				<div th:if="${formmode}=='list'" class="content">
					<div class="row">
						<div class="col-sm-12">
							<div class="card-header" id="modheadtitle">
								<b th:text="${menuname}"></b>
							</div>
							<table class="table table-bordered  table-hover table-sm"
								style="width: 100%" id="usertable">
								<thead class="thead-light" >

									<tr>
										<!-- <th></th> -->
										<th>ACCOUNT NUM</th>
																			
									</tr>
								</thead>
								<tbody>
									<tr th:each="AccountsInquiryEntity : ${AccountMaster}" th:attr="data-acid=${AccountsInquiryEntity.acid}" onclick="fnClick(this);">									
										<td th:text="${AccountsInquiryEntity.acid}" ></td>
															
									</tr>

								</tbody>
							</table>
							<!---------------------User List Ends--------------------------------------------------------->

							<!------------------------------ Report Details pagination - shown if paginated -------------------------------------------------->
							<div class="float-right"
								th:if="${AccountMaster.totalPages} gt 1">
								<a href="#"><i class="fas fa-caret-left fa-2x"
									th:onclick="|getUserlist('prevpage',${AccountMaster.number},${AccountMaster.totalPages});|"></i></a>
								<input type="text" id="pageno" style="width: 30px"
									th:value="${AccountMaster.number+1}"
									th:onchange="|getUserlist('givenpage',${AccountMaster.number},${AccountMaster.totalPages});|"></input>
								of <font th:text="${AccountMaster.totalPages}"></font> <a
									href="#"><i class="fas fa-caret-right fa-2x"
									th:onclick="|getUserlist('nextpage',${AccountMaster.number},${AccountMaster.totalPages});|"></i></a>
							</div>
						</div>
					</div>
				</div>
				
				<!------------------------Pop window - Domain  list Ends--------------------------------->
				<!--------------------------------------------------------------- Modal for alert messages-------------------------------->
			</div>
		</div>
	</div>
	<!--------------------------------------------------------------- Modal for alert messages-------------------------------->
</body>
</html>
