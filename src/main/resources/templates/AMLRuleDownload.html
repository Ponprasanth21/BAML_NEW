	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);
		var max = parseInt(maxpage);

		var Callurl = 'monitoringparameter?formmode=list';

		switch (mode) {
		case "nextpage":
			n = n + 1;
			if (n > max) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "prevpage":
			n = n - 1;
			if (n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
			break;
		case "givenpage":
			n = parseInt($("#pageno").val()) - 1;
			if (n > max || n < 0) {
				break;
			}
			Callurl = Callurl + "&page=" + n;
		}

		location.href = Callurl;
	}

	function verifyform(a) {
		if ($("#MonitorParameter").valid()) {
			var entry=$("#entry_user").val();
			var modify=$("#modify_user").val();
			var verify=$("#verify_user").val();
			
			if(modify!= null){
				if(modify != verify){
					var formmode = a.getAttribute("data-formmode");
					var url = "./createMonitoringParameter?formmode=" + formmode;

					$("#MonitorParameter").attr('action', url);

					var options = {
						success : showResponse
					// post-submit callback 
					};
					

					$("#MonitorParameter").ajaxSubmit(options);

					function showResponse(responseText, statusText, xhr, $form) {

						$("#alertmsg").text(responseText);

						$('#alert').modal("toggle");

					};
				}else{
					$("#verifyboxmsg").text("Same User Cannot Verify!");
					$('#verifybox').modal("toggle");
				
					
				}
			}else if( modify == null){
				if(entry != verify){
					var formmode = a.getAttribute("data-formmode");
					var url = "./createMonitoringParameter?formmode=" + formmode;

					$("#MonitorParameter").attr('action', url);

					var options = {

					};
				}else{
					$("#verifyboxmsg").text("Same User Cannot Verify!");
					$('#verifybox').modal("toggle");
				
					
				}
				
			}
			
		}
	};
